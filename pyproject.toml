[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "things-workbench"
version = "0.1.0"
description = "Explicit-path read-only SQLite inspection for Things stores"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
things-workbench = "things_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["things_workbench*"]
